<!DOCTYPE html>
<html>
<head>
<title>Donation</title>

<style>

body{
font-family:Arial, sans-serif;
background:#fff5eb;
margin:0;
}

/* MOBILE RESPONSIVE */

@media(max-width:768px){

.header{
flex-direction:column;
align-items:center;
text-align:center;
padding:15px;
}

nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
margin-top:10px;
}

nav a{
margin:4px 6px;
font-size:14px;
}

.container{
margin:15px;
padding:20px;
}

h1{
font-size:22px;
}

.section{
font-size:17px;
}

.form-grid{
grid-template-columns:1fr;
gap:14px;
}

.form-group.full{
grid-column:1;
}

input,
select{
font-size:16px;
padding:12px;
}

button{
font-size:17px;
padding:15px;
}

.qr-box img{
width:200px;
}

.logo-area img{
height:55px;
}

}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 40px;
background:#ff7a00;
color:white;
}

.logo-area{
display:flex;
align-items:center;
gap:12px;
}

.logo-area img{
height:65px;
width:auto;
background:white;
padding:4px;
border-radius:50%;
}

nav a{
color:white;
text-decoration:none;
margin:0 12px;
font-weight:bold;
}

/* container */

.container{
max-width:700px;
margin:30px auto;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* headings */

h1{
text-align:center;
color:#ff7a00;
margin-bottom:5px;
}

.section{
margin-top:30px;
font-size:18px;
font-weight:bold;
color:#333;
border-bottom:2px solid #ff7a00;
padding-bottom:6px;
}

/* form */

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:15px;
}

.form-group{
display:flex;
flex-direction:column;
}

.form-group.full{
grid-column:1/3;
}

label{
font-size:14px;
margin-bottom:4px;
font-weight:bold;
}

input,
select{
padding:10px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
}

/* QR */

.qr-box{
text-align:center;
margin-top:25px;
display:none;
animation:fadeIn .4s ease;
}

.qr-box img{
width:260px;
border:5px solid #f1f5f9;
border-radius:20px;
padding:10px;
background:white;
}

.amount-box{
margin-top:15px;
font-size:24px;
font-weight:bold;
color:#16a34a;
}

.upi-box{
margin-top:10px;
background:#fff7ed;
padding:12px;
border-radius:10px;
font-size:14px;
color:#444;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* button */

button{
background:#ff7a00;
color:white;
padding:14px;
border:none;
width:100%;
font-size:16px;
border-radius:8px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#e66900;
}

</style>
</head>

<body>

<header class="header">

<div class="logo-area">

<img src="images/logo.png">

<div>
<strong>म.प्र.वि.मं. तकनीकी कर्मचारी संघ</strong><br>
<span style="font-size:12px;">श्रमेव जयते</span>
</div>

</div>

<nav>

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
<a href="registration.html">Registration</a>
<a href="donation.html" class="donation-btn">Donation</a>

</nav>

</header>

<div class="container">

<h1>Donation Form</h1>

<form action="https://api.web3forms.com/submit" method="POST">

<input type="hidden" name="access_key" value="ce2e7089-54a4-45dc-90e9-915f2dbf3c85">

<input type="hidden" name="subject" value="New Donation Received">

<div class="section">Donation Details</div>

<div class="form-grid">

<div class="form-group">
<label>पूरा नाम</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>मोबाइल नंबर</label>
<input type="text" name="mobile" required>
</div>

<div class="form-group full">
<label>Union ID (अगर हो)</label>
<input type="text" name="union_id">
</div>

</div>

<!-- =========================
PAYMENT SECTION
========================= -->

<div class="section">Payment</div>

<div class="form-group">

<label>Select Donation Amount</label>

<select
id="donationAmount"
name="donation_amount"
onchange="generateQR()"
required>

<option value="">
Select Amount
</option>

<option value="100">
Monthly Donation ₹100
</option>

<option value="600">
Halfyearly Donation ₹600
</option>

<option value="1200">
Yearly Donation ₹1200
</option>

<option value="custom">
Any Amount
</option>

</select>

<!-- =========================
CUSTOM AMOUNT
========================= -->

<div
id="customAmountBox"
style="
display:none;
margin-top:15px;">

<label>

Enter Amount

</label>

<input
type="number"
id="customAmount"
placeholder="Enter Any Amount"
oninput="generateQR()"
style="
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-top:8px;">

</div>

</div>

<!-- =========================
QR BOX
========================= -->

<div
id="qrBox"
class="qr-box">

<h2 style="color:#ff7a00;">

Scan QR To Pay

</h2>

<img
id="qrImage">

<div
id="amountText"
class="amount-box">

</div>

<div class="upi-box">

UPI ID :
Mpvmtks.82233143@hdfcbank

</div>

<p style="
margin-top:15px;
color:#555;">

QR स्कैन करते ही राशि अपने आप भर जाएगी

</p>

</div>

<!-- =========================
PAYMENT VERIFY
========================= -->

<div class="section">Payment Verification</div>

<div class="form-group">

<label>UTR नंबर</label>

<input type="text"
name="utr_number"
required>

</div>

<button type="submit">

Donation Submit

</button>

</form>

</div>

<script>

function generateQR(){

let amount = document.getElementById(
"donationAmount"
).value;

if(amount != ""){

// =========================
// YOUR UPI LINK
// =========================

let upiLink =

"upi://pay?pa=Mpvmtks.82233143@hdfcbank"

+ "&pn=Donation"

+ "&am=" + amount

+ "&cu=INR";

// =========================
// QR GENERATOR
// =========================

let qrURL =

"https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="

+ encodeURIComponent(upiLink);

// =========================
// SHOW QR
// =========================

document.getElementById(
"qrImage"
).src = qrURL;

document.getElementById(
"amountText"
).innerHTML =

"Amount : ₹" + amount;

document.getElementById(
"qrBox"
).style.display = "block";

}

else{

document.getElementById(
"qrBox"
).style.display = "none";

}

}

</script>

</body>
</html>
