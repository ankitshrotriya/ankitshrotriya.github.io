<style>

/* PASSWORD SCREEN */

#passwordScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.password-box{
background:white;
padding:25px;
border-radius:12px;
width:100%;
max-width:350px;
box-shadow:0 4px 15px rgba(0,0,0,0.15);
text-align:center;
}

.password-box h2{
color:#ff7a00;
margin-bottom:20px;
}

.password-box input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:15px;
font-size:16px;
}

.password-box button{
width:100%;
padding:12px;
border:none;
background:#ff7a00;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

#reportFilters{
display:flex;
gap:10px;
flex-wrap:wrap;
}

#reportFilters input,
#reportFilters select{
padding:10px;
border:1px solid #ccc;
border-radius:6px;
}

.spinner{
border:5px solid #f3f3f3;
border-top:5px solid #ff7a00;
border-radius:50%;
width:50px;
height:50px;
animation:spin 1s linear infinite;
margin:20px auto;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* MAIN CONTENT */

#mainContent{
display:none;
}

h1{
text-align:center;
color:#ff7a00;
margin-bottom:20px;
font-size:24px;
}

/* TOP BUTTONS */

.top-buttons{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.top-buttons button{
background:#ff7a00;
color:white;
border:none;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
font-size:14px;
font-weight:bold;
}

/* LOADER */

.loader{
text-align:center;
font-size:20px;
margin-top:50px;
font-weight:bold;
color:#ff7a00;
}

/* MOBILE CARDS */

.mobile-cards{
display:block;
}

.card{
background:white;
padding:14px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card h3{
color:#ff7a00;
margin-bottom:10px;
font-size:20px;
}

.card p{
margin:7px 0;
font-size:14px;
word-break:break-word;
line-height:1.5;
}

.card strong{
color:#333;
}

.action-buttons{
margin-top:12px;
display:flex;
flex-direction:column;
gap:10px;
}

.approve-btn{
background:green;
color:white;
border:none;
padding:12px;
border-radius:6px;
cursor:pointer;
font-size:15px;
width:100%;
}

.reject-btn{
background:red;
color:white;
border:none;
padding:12px;
border-radius:6px;
cursor:pointer;
font-size:15px;
width:100%;
}

.status-approved{
color:green;
font-weight:bold;
}

.status-rejected{
color:red;
font-weight:bold;
}

.status-pending{
color:orange;
font-weight:bold;
}

/* MOBILE */

@media(max-width:768px){

body{
padding:10px;
}

h1{
font-size:22px;
}

.card{
padding:12px;
}

.card p{
font-size:13px;
}

}

</style>

========================= */

data: membershipData,
error: membershipError
} = await supabase

.from('membership_registration')

.select('*')

.eq('payment_status', true)

.order('id', { ascending:false })

/* =========================
DONATION DATA
========================= */

const {
data: donationData,
error: donationError
} = await supabase

.from('donation')

.select('*')

.eq('payment_status', true)

.order('id', { ascending:false })

if(membershipError){

alert(membershipError.message)
return

}

if(donationError){

alert(donationError.message)
return

TOTALS
========================= */

let membershipTotal = 0
let donationTotal = 0

membershipData.forEach(item => {

membershipTotal += Number(
item.membership_fee || 0
)

})

donationData.forEach(item => {

donationTotal += Number(
item.final_amount || 0
)

})

const grandTotal =
membershipTotal + donationTotal

/* =========================
COMBINE DATA
========================= */

const allData = [

...(membershipData || []).map(item => ({
...item,
transaction_type: 'Membership',
amount:
item.membership_fee || ''
})),

...(donationData || []).map(item => ({
...item,
transaction_type: 'Donation',

item.final_amount || ''

========================= */

window.updateMembershipStatus =
async function(id, status){

let confirmMsg = status
? 'Approve this payment?'
: 'Reject this payment?'

if(!confirm(confirmMsg)) return

const { error } = await supabase

.from('membership_registration')

.update({
payment_status: status
})

.eq('id', id)

if(error){

alert(error.message)

}else{

alert('Status Updated Successfully')

loadMembership()

}

}

UPDATE DONATION STATUS
========================= */

async function(id, status){

let confirmMsg = status
? 'Approve this donation?'
: 'Reject this donation?'

const { error } = await supabase

.from('donation')

.update({
payment_status: status
})

.eq('id', id)

if(error){

alert(error.message)

}else{

alert('Donation Status Updated Successfully')

loadDonation()

}

const company =
document.getElementById('companyFilter').value

const position =
document.getElementById('positionFilter').value

const fromDate =

document.getElementById('toDate').value

overflow-x:auto;

.from('membership_registration')

if(position)

item.created_at.substring(0,10) : ''}</td>

`

})

.from('donation')
