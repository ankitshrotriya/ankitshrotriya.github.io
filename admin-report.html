<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Report</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:12px;
}

/* PASSWORD SCREEN */

#passwordScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.password-box{
background:white;
padding:25px;
border-radius:12px;
width:100%;
max-width:350px;
box-shadow:0 4px 15px rgba(0,0,0,0.15);
text-align:center;
}

.password-box h2{
color:#ff7a00;
margin-bottom:20px;
}

.password-box input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:15px;
font-size:16px;
}

.password-box button{
width:100%;
padding:12px;
border:none;
background:#ff7a00;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

/* MAIN CONTENT */

#mainContent{
display:none;
}

h1{
text-align:center;
color:#ff7a00;
margin-bottom:20px;
font-size:24px;
}

.loader{
text-align:center;
font-size:20px;
margin-top:50px;
font-weight:bold;
color:#ff7a00;
}

/* MOBILE CARDS */

.mobile-cards{
display:block;
}

.card{
background:white;
padding:14px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card h3{
color:#ff7a00;
margin-bottom:10px;
font-size:20px;
}

.card p{
margin:7px 0;
font-size:14px;
word-break:break-word;
line-height:1.5;
}

.card strong{
color:#333;
}

.action-buttons{
margin-top:12px;
display:flex;
flex-direction:column;
gap:10px;
}

.approve-btn{
background:green;
color:white;
border:none;
padding:12px;
border-radius:6px;
cursor:pointer;
font-size:15px;
width:100%;
}

.reject-btn{
background:red;
color:white;
border:none;
padding:12px;
border-radius:6px;
cursor:pointer;
font-size:15px;
width:100%;
}

.status-approved{
color:green;
font-weight:bold;
}

.status-rejected{
color:red;
font-weight:bold;
}

.status-pending{
color:orange;
font-weight:bold;
}

/* MOBILE */

@media(max-width:768px){

body{
padding:10px;
}

h1{
font-size:22px;
}

.card{
padding:12px;
}

.card p{
font-size:13px;
}

}

</style>

</head>

<body>

<!-- PASSWORD SCREEN -->

<div id="passwordScreen">

<div class="password-box">

<h2>Admin Login</h2>

<input
type="password"
id="passwordInput"
placeholder="Enter Password"
>

<button onclick="checkPassword()">
Login
</button>

</div>

</div>

<!-- MAIN CONTENT -->

<div id="mainContent">

<h1>Membership Registration Report</h1>

<div class="loader" id="loader">
Loading Data...
</div>

<div class="mobile-cards" id="mobileCards">
</div>

</div>

<script>

function checkPassword(){

const password = "Admin@2026"

const enteredPassword =
document.getElementById("passwordInput").value

if(enteredPassword === password){

document.getElementById("passwordScreen").style.display = "none"

document.getElementById("mainContent").style.display = "block"

}else{

alert("Wrong Password")

}

}

</script>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl =
'https://uxdeihxbacsrpxugibqq.supabase.co'

const supabaseKey =
'sb_publishable_toimxIMSyU-ld7bE-5AjYA_x7CmUh_G'

const supabase = createClient(
supabaseUrl,
supabaseKey
)

async function loadData(){

const { data, error } = await supabase
.from('membership_registration')
.select('*')
.order('id', { ascending:false })

console.log(data)
console.log(error)

if(error){

alert(error.message)
return

}

const mobileCards =
document.getElementById('mobileCards')

mobileCards.innerHTML = ''

if(data.length === 0){

mobileCards.innerHTML = `

<div class="card">
No Data Found
</div>

`

}

for(let item of data){

let statusText = 'Pending'
let statusClass = 'status-pending'

if(item.payment_status === true){

statusText = 'Approved'
statusClass = 'status-approved'

}

if(item.payment_status === false){

statusText = 'Rejected'
statusClass = 'status-rejected'

}

mobileCards.innerHTML += `

<div class="card">

<h3>${item.name || ''}</h3>

<p>
<strong>ID:</strong>
${item.id}
</p>

<p>
<strong>Father Name:</strong>
${item.father_name || ''}
</p>

<p>
<strong>Email:</strong>
${item.email || ''}
</p>

<p>
<strong>Mobile:</strong>
${item.mobile || ''}
</p>

<p>
<strong>DOB:</strong>
${item.dob || ''}
</p>

<p>
<strong>District:</strong>
${item.district || ''}
</p>

<p>
<strong>Company:</strong>
${item.company_name || ''}
</p>

<p>
<strong>Position:</strong>
${item.position || ''}
</p>

<p>
<strong>Office:</strong>
${item.office_name || ''}
</p>

<p>
<strong>Employee Class:</strong>
${item.employee_class || ''}
</p>

<p>
<strong>Pincode:</strong>
${item.pincode || ''}
</p>

<p>
<strong>Fee:</strong>
₹${item.membership_fee || ''}
</p>

<p>
<strong>UTR:</strong>
${item.utr_number || ''}
</p>

<p class="${statusClass}">

<strong>Status:</strong>

${statusText}

</p>

<div class="action-buttons">

<button
class="approve-btn"
onclick="updateStatus(${item.id}, true)"
>

Approve

</button>

<button
class="reject-btn"
onclick="updateStatus(${item.id}, false)"
>

Reject

</button>

</div>

</div>

`

}

window.updateStatus = async function(id, status){

let confirmMsg = status
? 'Approve this payment?'
: 'Reject this payment?'

if(!confirm(confirmMsg)) return

const { error } = await supabase
.from('membership_registration')
.update({ payment_status: status })
.eq('id', id)

if(error){

alert(error.message)

}else{

alert('Status Updated Successfully')

loadData()

}

}

document.getElementById('loader').style.display='none'

}

loadData()

</script>

</body>
</html>
